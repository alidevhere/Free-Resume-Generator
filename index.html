<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Resume Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-1: #f5f7fb;
            --bg-2: #e7edf7;
            --panel: #ffffff;
            --ink: #1b2430;
            --muted: #5a6777;
            --line: #dbe2ec;
            --brand: #2563eb;
            --brand-2: #1d4ed8;
            --accent: #0f172a;
            --success: #059669;
            --error: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 20%, #dbe7ff 0%, transparent 35%),
                radial-gradient(circle at 85% 0%, #d9f6eb 0%, transparent 30%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(110deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%);
            color: #fff;
            padding: 22px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.98rem;
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.8fr);
            gap: 16px;
            padding: 16px;
            min-height: 0;
        }

        .preview-pane {
            background: #0b1220;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            border: 1px solid #1f2937;
            box-shadow: 0 18px 35px rgba(2, 6, 23, 0.35);
            min-height: 0;
            overflow: hidden;
        }

        .preview-toolbar {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.3);
            color: #dbeafe;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .preview-status {
            font-weight: 600;
        }

        .preview-frame-wrap {
            flex: 1;
            display: flex;
            background: repeating-linear-gradient(
                -45deg,
                #0f172a,
                #0f172a 16px,
                #111d35 16px,
                #111d35 32px
            );
            padding: 18px;
            min-height: 0;
        }

        #pdfPreview {
            display: block;
            width: 100%;
            flex: 1;
            min-height: 0;
            border: none;
            border-radius: 10px;
            background: #f8fafc;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
        }

        .preview-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            text-align: center;
            color: #475569;
            background: #f8fafc;
            border-radius: 10px;
            padding: 24px;
        }

        .preview-link {
            color: #bfdbfe;
            text-decoration: none;
            font-weight: 600;
        }

        .preview-link:hover {
            text-decoration: underline;
        }

        .form-pane {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: auto;
            min-height: 0;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        }

        .form-pane-inner {
            padding: 20px;
        }

        .build-bar {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--line);
            padding: 12px;
            margin: -20px -20px 20px;
            backdrop-filter: blur(5px);
        }

        .build-actions {
            display: flex;
            gap: 10px;
        }

        .section {
            margin-bottom: 26px;
            border-bottom: 1px solid #edf1f6;
            padding-bottom: 20px;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d4deea;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
            background: #fff;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="url"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .item-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }

        .item-card.empty-state {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        .item-card .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .item-card .remove-btn:hover {
            background: #dc2626;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-build {
            background: var(--brand);
            color: #fff;
            flex: 1;
            padding: 12px;
        }

        .btn-build:hover {
            background: var(--brand-2);
            transform: translateY(-1px);
        }

        .btn-add {
            background: #334155;
            color: white;
        }

        .btn-add:hover {
            background: #1f2937;
            transform: translateY(-2px);
        }

        .btn-pdf {
            background: #047857;
            color: white;
            flex: 1;
        }

        .btn-pdf:hover {
            background: #065f46;
        }

        .btn-latex {
            background: #0f172a;
            color: white;
            flex: 1;
        }

        .btn-latex:hover {
            background: #1e293b;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .array-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .array-input input {
            flex: 1;
        }

        .array-input button {
            padding: 8px 15px;
            background: #ff6b6b;
            color: white;
        }

        .array-input button:hover {
            background: #ee5a6f;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 999;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--error);
        }

        button:disabled {
            background: #94a3b8;
            color: #f8fafc;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 1050px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 48vh auto;
            }

            .preview-pane {
                min-height: 0;
            }
        }

        @media (max-width: 700px) {
            .two-column {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .build-actions,
            .action-buttons {
                flex-direction: column;
            }

            .workspace {
                padding: 10px;
                gap: 10px;
                grid-template-rows: 42vh auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Free Resume Generator</h1>
            <p>Build and preview your resume side by side.</p>
        </div>

        <div class="workspace">
            <section class="preview-pane">
                <div class="preview-toolbar">
                    <span>PDF Preview</span>
                    <span class="preview-status" id="previewStatus">Waiting for first build</span>
                    <a href="#" class="preview-link" id="openPreviewLink" target="_blank" rel="noopener noreferrer">Open in new tab</a>
                </div>
                <div class="preview-frame-wrap">
                    <object id="pdfPreview" type="application/pdf" data="">
                        <div class="preview-fallback">
                            <div>
                                <h3 style="margin-bottom: 8px; color: #0f172a;">Preview not available</h3>
                                <p>The browser could not display the PDF inline. Use Open in new tab to inspect the generated resume.</p>
                            </div>
                        </div>
                    </object>
                </div>
            </section>

            <aside class="form-pane">
                <div class="form-pane-inner">
                    <div class="build-bar">
                        <div class="build-actions">
                            <button type="button" class="btn-build" id="buildButton" onclick="buildAndPreviewPDF()">Build & Preview</button>
                        </div>
                    </div>

                    <form id="resumeForm">
                        <!-- Template -->
                        <div class="section">
                            <h2 class="section-title">Resume Template</h2>
                            <div class="form-group">
                                <label for="template">Template</label>
                                <select id="template">
                                    <option value="enhanced-faang-resume" selected>Enhanced FAANG Resume</option>
                                </select>
                            </div>
                        </div>

                        <!-- Personal Information -->
                        <div class="section">
                            <h2 class="section-title">Personal Information</h2>
                            <div class="form-group">
                                <label>Full Name *</label>
                                <input type="text" id="name" required placeholder="John Doe">
                            </div>
                            <div class="two-column">
                                <div class="form-group">
                                    <label>Email *</label>
                                    <input type="email" id="email" required placeholder="john@example.com">
                                </div>
                                <div class="form-group">
                                    <label>Phone</label>
                                    <input type="text" id="phone" placeholder="+1 (555) 123-4567">
                                </div>
                            </div>
                            <div class="two-column">
                                <div class="form-group">
                                    <label>Website</label>
                                    <input type="url" id="website" placeholder="yourwebsite.com">
                                </div>
                                <div class="form-group">
                                    <label>GitHub</label>
                                    <input type="text" id="github" placeholder="yourgithub">
                                </div>
                            </div>
                            <div class="two-column">
                                <div class="form-group">
                                    <label>LinkedIn</label>
                                    <input type="text" id="linkedin" placeholder="yourlinkedin">
                                </div>
                            </div>
                        </div>

                        <!-- Summary -->
                        <div class="section">
                            <h2 class="section-title">Summary</h2>
                            <div class="form-group">
                                <label>Professional Summary</label>
                                <textarea id="summary" placeholder="Brief overview of your professional background..."></textarea>
                            </div>
                        </div>

                        <!-- Experience -->
                        <div class="section">
                            <h2 class="section-title">Experience</h2>
                            <div id="experienceList"></div>
                            <button type="button" class="btn-add" onclick="addExperience()">+ Add Experience</button>
                        </div>

                        <!-- Education -->
                        <div class="section">
                            <h2 class="section-title">Education</h2>
                            <div id="educationList"></div>
                            <button type="button" class="btn-add" onclick="addEducation()">+ Add Education</button>
                        </div>

                        <!-- Projects -->
                        <div class="section">
                            <h2 class="section-title">Projects</h2>
                            <div id="projectsList"></div>
                            <button type="button" class="btn-add" onclick="addProject()">+ Add Project</button>
                        </div>

                        <!-- Skills -->
                        <div class="section">
                            <h2 class="section-title">Technical Skills</h2>
                            <div id="skillsList"></div>
                            <button type="button" class="btn-add" onclick="addSkill()">+ Add Skill Category</button>
                        </div>

                        <!-- Certifications -->
                        <div class="section">
                            <h2 class="section-title">Certifications</h2>
                            <div id="certificationsList"></div>
                            <button type="button" class="btn-add" onclick="addCertification()">+ Add Certification</button>
                        </div>

                        <!-- Action Buttons -->
                        <div class="action-buttons">
                            <button type="button" class="btn-pdf" id="downloadPdfButton" onclick="downloadPDF()">Download PDF</button>
                            <button type="button" class="btn-latex" id="downloadLatexButton" onclick="generateLatex()">Download LaTeX</button>
                        </div>
                    </form>
                </div>
            </aside>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:8080';
        let latestPdfBlob = null;
        let latestPdfObjectUrl = null;
        let isBuilding = false;
        let currentBuildController = null;

        function setBuildState(building, statusText) {
            isBuilding = building;
            document.getElementById('buildButton').disabled = building;
            document.getElementById('downloadPdfButton').disabled = building;
            document.getElementById('downloadLatexButton').disabled = building;
            document.getElementById('previewStatus').textContent = statusText;
        }

        function setPreviewPDF(blob) {
            const preview = document.getElementById('pdfPreview');
            const openPreviewLink = document.getElementById('openPreviewLink');
            if (latestPdfObjectUrl) {
                URL.revokeObjectURL(latestPdfObjectUrl);
            }
            latestPdfObjectUrl = URL.createObjectURL(blob);
            preview.data = latestPdfObjectUrl;
            openPreviewLink.href = latestPdfObjectUrl;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function addExperience() {
            const list = document.getElementById('experienceList');
            const id = Date.now();
            const html = `
                <div class="item-card" id="exp-${id}">
                    <button type="button" class="remove-btn" onclick="document.getElementById('exp-${id}').remove()">✕</button>
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" class="exp-company" placeholder="Company Name">
                    </div>
                    <div class="two-column">
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" class="exp-title" placeholder="Software Engineer">
                        </div>
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" class="exp-location" placeholder="City, Country">
                        </div>
                    </div>
                    <div class="two-column">
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="text" class="exp-start" placeholder="Jan 2020">
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="text" class="exp-end" placeholder="Present">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Responsibilities (one per line)</label>
                        <textarea class="exp-bullets" placeholder="Led project development&#10;Improved performance by 40%"></textarea>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
        }

        function addEducation() {
            const list = document.getElementById('educationList');
            const id = Date.now();
            const html = `
                <div class="item-card" id="edu-${id}">
                    <button type="button" class="remove-btn" onclick="document.getElementById('edu-${id}').remove()">✕</button>
                    <div class="form-group">
                        <label>School/University</label>
                        <input type="text" class="edu-school" placeholder="University Name">
                    </div>
                    <div class="two-column">
                        <div class="form-group">
                            <label>Degree</label>
                            <input type="text" class="edu-degree" placeholder="Bachelor of Science">
                        </div>
                        <div class="form-group">
                            <label>Field of Study</label>
                            <input type="text" class="edu-field" placeholder="Computer Science">
                        </div>
                    </div>
                    <div class="two-column">
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" class="edu-location" placeholder="City, Country">
                        </div>
                        <div class="form-group">
                            <label>Graduation Year</label>
                            <input type="text" class="edu-end" placeholder="2020">
                        </div>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
        }

        function addProject() {
            const list = document.getElementById('projectsList');
            const id = Date.now();
            const html = `
                <div class="item-card" id="proj-${id}">
                    <button type="button" class="remove-btn" onclick="document.getElementById('proj-${id}').remove()">✕</button>
                    <div class="form-group">
                        <label>Project Name</label>
                        <input type="text" class="proj-name" placeholder="Project Name">
                    </div>
                    <div class="form-group">
                        <label>Project Link</label>
                        <input type="url" class="proj-link" placeholder="https://github.com/user/project">
                    </div>
                    <div class="form-group">
                        <label>Technologies (comma-separated)</label>
                        <input type="text" class="proj-tech" placeholder="React, Node.js, MongoDB">
                    </div>
                    <div class="form-group">
                        <label>Description (one per line)</label>
                        <textarea class="proj-bullets" placeholder="Built a web application&#10;Implemented REST API"></textarea>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
        }

        function addSkill() {
            const list = document.getElementById('skillsList');
            const id = Date.now();
            const html = `
                <div class="item-card" id="skill-${id}">
                    <button type="button" class="remove-btn" onclick="document.getElementById('skill-${id}').remove()">✕</button>
                    <div class="form-group">
                        <label>Skill Category</label>
                        <input type="text" class="skill-title" placeholder="Languages">
                    </div>
                    <div class="form-group">
                        <label>Skills (comma-separated)</label>
                        <input type="text" class="skill-items" placeholder="JavaScript, Python, Go">
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
        }

        function addCertification() {
            const list = document.getElementById('certificationsList');
            const id = Date.now();
            const html = `
                <div class="item-card" id="cert-${id}">
                    <button type="button" class="remove-btn" onclick="document.getElementById('cert-${id}').remove()">✕</button>
                    <div class="form-group">
                        <label>Certification Name</label>
                        <input type="text" class="cert-name" placeholder="AWS Certified Solutions Architect">
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
        }

        function buildResume() {
            const experience = Array.from(document.querySelectorAll('#experienceList .item-card'))
                .map(card => ({
                    company: card.querySelector('.exp-company').value.trim(),
                    title: card.querySelector('.exp-title').value.trim(),
                    location: card.querySelector('.exp-location').value.trim(),
                    start: card.querySelector('.exp-start').value.trim(),
                    end: card.querySelector('.exp-end').value.trim(),
                    bullets: card.querySelector('.exp-bullets').value.split('\n').map(b => b.trim()).filter(Boolean)
                }))
                .filter(item => item.company || item.title || item.location || item.start || item.end || item.bullets.length > 0);

            const education = Array.from(document.querySelectorAll('#educationList .item-card'))
                .map(card => ({
                    school: card.querySelector('.edu-school').value.trim(),
                    degree: card.querySelector('.edu-degree').value.trim(),
                    location: card.querySelector('.edu-location').value.trim(),
                    end: card.querySelector('.edu-end').value.trim()
                }))
                .filter(item => item.school || item.degree || item.location || item.end);

            const projects = Array.from(document.querySelectorAll('#projectsList .item-card'))
                .map(card => ({
                    name: card.querySelector('.proj-name').value.trim(),
                    link: card.querySelector('.proj-link').value.trim(),
                    technologies: card.querySelector('.proj-tech').value.split(',').map(t => t.trim()).filter(Boolean),
                    bullets: card.querySelector('.proj-bullets').value.split('\n').map(b => b.trim()).filter(Boolean)
                }))
                .filter(item => item.name || item.link || item.technologies.length > 0 || item.bullets.length > 0);

            const skills = Array.from(document.querySelectorAll('#skillsList .item-card'))
                .map(card => ({
                    title: card.querySelector('.skill-title').value.trim(),
                    items: card.querySelector('.skill-items').value.split(',').map(i => i.trim()).filter(Boolean)
                }))
                .filter(item => item.title || item.items.length > 0);

            const certifications = Array.from(document.querySelectorAll('#certificationsList .item-card'))
                .map(card => ({
                    name: card.querySelector('.cert-name').value.trim()
                }))
                .filter(item => item.name);

            return {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                website: document.getElementById('website').value,
                github: document.getElementById('github').value,
                linkedin: document.getElementById('linkedin').value,
                template: document.getElementById('template').value,
                summary: document.getElementById('summary').value,
                experience,
                education,
                projects,
                skills,
                certifications,
                openSourceContributions: []
            };

        }

        function downloadFile(blob, filename) {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        async function buildAndPreviewPDF() {
            if (isBuilding) {
                return;
            }

            const resume = buildResume();

            if (!resume.name || !resume.email) {
                showToast('Name and email are required.', 'error');
                return;
            }

            if (currentBuildController) {
                currentBuildController.abort();
            }

            currentBuildController = new AbortController();
            setBuildState(true, 'Building PDF...');

            try {
                const response = await fetch(`${API_URL}/api/resume/pdf`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resume }),
                    signal: currentBuildController.signal
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text}`);
                }

                const blob = await response.blob();
                latestPdfBlob = blob;
                setPreviewPDF(blob);
                setBuildState(false, `Preview updated at ${new Date().toLocaleTimeString()}`);
                showToast('Preview updated successfully.', 'success');
                return blob;
            } catch (error) {
                if (error.name === 'AbortError') {
                    setBuildState(false, 'Build canceled');
                    return null;
                }
                setBuildState(false, 'Build failed');
                showToast(`Error: ${error.message}`, 'error');
                return null;
            }
        }

        async function downloadPDF() {
            if (isBuilding) {
                return;
            }

            let blob = latestPdfBlob;
            if (!blob) {
                blob = await buildAndPreviewPDF();
            }

            if (blob) {
                downloadFile(blob, 'resume.pdf');
                showToast('PDF downloaded successfully!', 'success');
            }
        }

        async function generateLatex() {
            if (isBuilding) {
                return;
            }

            const resume = buildResume();
            const previousStatus = document.getElementById('previewStatus').textContent;

            try {
                setBuildState(true, 'Generating LaTeX...');
                const response = await fetch(`${API_URL}/api/resume/latex`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resume })
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text}`);
                }

                const blob = await response.blob();
                downloadFile(blob, 'resume.tex');
                showToast('LaTeX downloaded successfully!', 'success');
                setBuildState(false, previousStatus);
            } catch (error) {
                setBuildState(false, 'LaTeX generation failed');
                showToast(`Error: ${error.message}`, 'error');
            }
        }

        // Preserve backward compatibility for previous button handlers.
        window.generatePDF = downloadPDF;

        // Seed one card for each major repeating section.
        addExperience();
        addEducation();
        addProject();
        addSkill();
        addCertification();

        // Prevent form submission reloading the page.
        document.getElementById('resumeForm').addEventListener('submit', function (event) {
            event.preventDefault();
            buildAndPreviewPDF();
        });

        window.addEventListener('beforeunload', function () {
            if (latestPdfObjectUrl) {
                URL.revokeObjectURL(latestPdfObjectUrl);
            }
            if (currentBuildController) {
                currentBuildController.abort();
            }
        });

        document.getElementById('pdfPreview').srcdoc = `
            <html>
                <body style="margin:0;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,Tahoma,sans-serif;color:#475569;background:#f1f5f9;">
                    <div style="text-align:center;padding:24px;line-height:1.5;max-width:320px;">
                        <h3 style="margin:0 0 8px;color:#0f172a;">Preview Not Built Yet</h3>
                        <p style="margin:0;">Fill the form and click Build &amp; Preview to render your resume PDF here.</p>
                    </div>
                </body>
            </html>
        `;

        // Expose builder for manual debugging in browser console.
        window.buildResume = buildResume;
        window.buildAndPreviewPDF = buildAndPreviewPDF;
        window.downloadPDF = downloadPDF;
        window.generateLatex = generateLatex;
        window.addExperience = addExperience;
        window.addEducation = addEducation;
        window.addProject = addProject;
        window.addSkill = addSkill;
        window.addCertification = addCertification;

        setBuildState(false, 'Waiting for first build');
    </script>
</body>
</html>
