services:
  backend:
    image: resume-generator-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"

  frontend:
    image: resume-generator-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - BACKEND_API_URL=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
